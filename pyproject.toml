[project]
name = "cpabot-client"
version = "0.1.0"
description = "Read-only CPA quota client for CliProxyAPI Bot Server_Mode"
readme = "README.md"
requires-python = ">=3.10, <4.0"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "websockets>=14.0",
]

[project.scripts]
cpabot-client = "cpabot_client.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cpabot_client"]
