[project]
name = "QuotaNoa-Client"
version = "0.1.0"
description = "QuotaNoa quota client with optional controlled Codex refresh for QuotaNoa-Bot Server_Mode"
readme = "README.md"
requires-python = ">=3.10, <4.0"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "websockets>=14.0",
]

[project.scripts]
quotanoa-client = "cpabot_client.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cpabot_client"]
